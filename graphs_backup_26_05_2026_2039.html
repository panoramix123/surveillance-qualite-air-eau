<html lang="fr">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/graphs.css">
</head>

<body class="page-graphs">

  <header class="topbar">
    <button class="burger" id="burgerBtn" aria-label="Ouvrir le menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <h1>Étude Indice de Qualité de l’Air</h1>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">
      <div class="sidebar-title">Menu</div>

      <nav class="menu">
        <a href="index.html" class="menu-item">Tableau de bord</a>

	<div class="menu-item has-submenu">
          <button type="button" class="menu-btn">
            Carte
            <span class="arrow">▶</span>
          </button>

          <div class="submenu">
            <div class="submenu-item has-submenu">
              <button type="button" class="menu-btn sub-btn">
                ST Gemmes-sur-Loire
                <span class="arrow">▶</span>
              </button>

              <div class="submenu submenu-right">
                <a href="map_ST_G.html" class="submenu-link">Rue du Moulin du Pain</a>
              </div>
            </div>

            <div class="submenu-item">
              <button type="button" class="submenu-link">Les Ponts-de-Cé</button>
            </div>

            <div class="submenu-item">
              <button type="button" class="submenu-link">Loire-Authion</button>
            </div>
          </div>
        </div>        

        <a href="graphs.html" class="menu-item">Graphiques</a>
        <a href="infos.html" class="menu-item">Informations complémentaires</a>
        <a href="#" class="menu-item">Paramètres</a>
        <a href="#" class="menu-item">À venir</a>
      </nav>
    </div>
  </aside>

  <main class="graphs-main">
    <section class="graphs-card">

      <h2>Polluants atmosphériques:</h2>

      <div class="graphs-layout">

        <div class="pollution-graph-box">
          <h3>Historique des polluants</h3>

          <div class="svg-chart-wrapper">
            <svg id="pollutantsSvg" viewBox="0 0 900 430" preserveAspectRatio="none"></svg>

            <div id="data-error" class="data-error hidden">
              Erreur d’acquisition des données
            </div>
          </div>

          <div id="chart-legend" class="chart-legend"></div>
        </div>

        <div class="co2-graph-box">
          <h3>TAUX DE CO2</h3>

          <div class="co2-info">
            <p>Pic max</p>
            <strong><span id="co2-max-value">--</span> mg/m<sup>3</sup></strong>
            <p>Date : <span id="co2-max-date">--</span></p>
          </div>

          <div class="co2-bar-graph">
            <div class="co2-max-bar">
              <span id="co2-max-bar-value">--</span>

              <div class="co2-current-bar" id="co2-current-bar">
                <span id="co2-current-bar-value">--</span>
              </div>
            </div>

            <div class="co2-current-label">
              <p>Taux instant.</p>
              <strong><span id="co2-current-value">--</span> mg/m<sup>3</sup></strong>
            </div>
          </div>
        </div>

      </div>

    </section>
  </main>

  <script src="JS/graphs.js"></script>
</body>
</html>
